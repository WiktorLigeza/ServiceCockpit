<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Browser screen</title>
    <!-- Loaded in an iframe by remote_browser.html. Kept out of styles.css on purpose:
         the cockpit's page zoom (styles.css) would throw off noVNC's pointer positions. -->
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #screen { position: absolute; inset: 0; }
        :fullscreen #screen, :fullscreen { background: #000; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <script src="{{ url_for('static', filename='js/remote_browser_screen.js') }}"></script>
</body>
</html>
