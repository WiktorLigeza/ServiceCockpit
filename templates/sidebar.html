<link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
<script src="{{ url_for('static', filename='js/sidebar.js') }}" defer></script>

<nav class="app-sidebar" id="app-sidebar">
    <div class="sidebar-items">
        <a class="sidebar-item {% if request.endpoint == 'services.index' %}sidebar-active{% endif %}"
           href="{{ url_for('services.index') }}" title="Services">
            <i class="fas fa-server"></i>
            <span class="sidebar-label">Services</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'processes.processes_page' %}sidebar-active{% endif %}"
           href="{{ url_for('processes.processes_page') }}" title="Processes">
            <i class="fas fa-tasks"></i>
            <span class="sidebar-label">Processes</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'mqtt.mqtt_explorer' %}sidebar-active{% endif %}"
           href="{{ url_for('mqtt.mqtt_explorer') }}" title="MQTT Explorer">
            <i class="fas fa-project-diagram"></i>
            <span class="sidebar-label">MQTT Explorer</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'file_explorer.file_explorer' %}sidebar-active{% endif %}"
           href="{{ url_for('file_explorer.file_explorer') }}" title="File Explorer">
            <i class="fas fa-folder-open"></i>
            <span class="sidebar-label">File Explorer</span>
        </a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-item" href="#" title="Devices" onclick="toggleDevicesManager(); return false;">
            <i class="fas fa-network-wired"></i>
            <span class="sidebar-label">Devices</span>
        </a>
        <a class="sidebar-item" href="#" title="Console" onclick="toggleConsole(); return false;">
            <i class="fas fa-terminal"></i>
            <span class="sidebar-label">Console</span>
        </a>
    </div>

    <div class="sidebar-bottom">
        <button type="button" class="sidebar-item sidebar-pin-btn" id="sidebar-pin-btn" title="Keep expanded" onclick="toggleSidebarPin(); return false;">
            <i class="fas fa-thumbtack"></i>
            <span class="sidebar-label">Keep expanded</span>
        </button>

        <a class="sidebar-item sidebar-danger" href="#" title="Reboot" onclick="requestReboot(); return false;">
            <i class="fas fa-sync-alt"></i>
            <span class="sidebar-label">Reboot</span>
        </a>
        <a class="sidebar-item sidebar-warning" href="/logout" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <span class="sidebar-label">Logout</span>
        </a>
    </div>
</nav>
