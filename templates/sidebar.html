<link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
<script src="{{ url_for('static', filename='js/sidebar.js') }}" defer></script>

<nav class="app-sidebar" id="app-sidebar">
    <div class="sidebar-items">
        <a class="sidebar-item {% if request.endpoint == 'services.index' %}sidebar-active{% endif %}"
           href="{{ url_for('services.index') }}" title="Services">
            <i class="fas fa-server"></i>
            <span class="sidebar-label">Services</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'processes.processes_page' %}sidebar-active{% endif %}"
           href="{{ url_for('processes.processes_page') }}" title="Processes">
            <i class="fas fa-tasks"></i>
            <span class="sidebar-label">Processes</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'mqtt.mqtt_explorer' %}sidebar-active{% endif %}"
           href="{{ url_for('mqtt.mqtt_explorer') }}" title="MQTT Explorer">
            <i class="fas fa-project-diagram"></i>
            <span class="sidebar-label">MQTT Explorer</span>
        </a>
        <a class="sidebar-item {% if request.endpoint == 'file_explorer.file_explorer' %}sidebar-active{% endif %}"
           href="{{ url_for('file_explorer.file_explorer') }}" title="File Explorer">
            <i class="fas fa-folder-open"></i>
            <span class="sidebar-label">File Explorer</span>
        </a>

        <div class="sidebar-divider"></div>

        <a class="sidebar-item" href="#" title="Devices" onclick="toggleDevicesManager(); return false;">
            <i class="fas fa-network-wired"></i>
            <span class="sidebar-label">Devices</span>
        </a>
        <div class="sidebar-console" id="sidebar-console">
            <div class="sidebar-item" title="Console">
                <i class="fas fa-terminal"></i>
                <span class="sidebar-label">Console</span>
                <span class="sidebar-console-count" id="sidebar-console-count" hidden>0</span>
            </div>
        </div>
        <div class="sidebar-console" id="sidebar-programs" hidden>
            <div class="sidebar-item" title="Running Programs">
                <i class="fas fa-play-circle"></i>
                <span class="sidebar-label">Programs</span>
                <span class="sidebar-console-count" id="sidebar-programs-count" hidden>0</span>
            </div>
        </div>
    </div>

    <div class="sidebar-bottom">
        <button type="button" class="sidebar-item sidebar-update" id="sidebar-update-item" title="Checking for updates..." onclick="performSidebarUpdate(); return false;">
            <span class="sidebar-update-dot" id="sidebar-update-dot"></span>
            <i class="fas fa-cloud-download-alt"></i>
            <span class="sidebar-label" id="sidebar-update-label">Update</span>
        </button>

        <button type="button" class="sidebar-item sidebar-pin-btn" id="sidebar-pin-btn" title="Keep expanded" onclick="toggleSidebarPin(); return false;">
            <i class="fas fa-thumbtack"></i>
            <span class="sidebar-label">Keep expanded</span>
        </button>

        <a class="sidebar-item sidebar-danger" href="#" title="Reboot" onclick="requestReboot(); return false;">
            <i class="fas fa-sync-alt"></i>
            <span class="sidebar-label">Reboot</span>
        </a>
        <a class="sidebar-item sidebar-warning" href="/logout" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <span class="sidebar-label">Logout</span>
        </a>
    </div>
</nav>

<!-- Positioned outside .app-sidebar (which clips overflow) so it can flyout
     past the sidebar's edge; shown/hidden via JS hover handling in sidebar.js. -->
<div class="sidebar-console-panel" id="sidebar-console-panel">
    <div class="sidebar-console-panel-header">Consoles</div>
    <div class="sidebar-console-panel-actions">
        <button type="button" onclick="openNewConsole(true); return false;">
            <i class="fas fa-user-shield"></i> New (Root)
        </button>
        <button type="button" onclick="openNewConsole(false); return false;">
            <i class="fas fa-user"></i> New (Normal)
        </button>
    </div>
    <div class="sidebar-console-panel-list" id="sidebar-console-panel-list">
        <div class="sidebar-console-panel-empty">No open consoles</div>
    </div>
</div>

<div class="sidebar-console-panel" id="sidebar-programs-panel">
    <div class="sidebar-console-panel-header">Running Programs</div>
    <div class="sidebar-console-panel-list" id="sidebar-programs-panel-list">
        <div class="sidebar-console-panel-empty">No running programs</div>
    </div>
</div>
