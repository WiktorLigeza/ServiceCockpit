<div class="infocard service-editor-card hidden" id="add-service-card">
    <div class="infocard-header">
        <span id="service-form-title">Add New Service</span>
        <div class="infocard-controls">
            <button class="btn-close"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="infocard-body service-editor-body">
        <div class="service-editor-layout">
            <form id="add-service-form" class="service-editor-form">
                    <div class="mb-3">
                        <label for="serviceName" class="form-label">Service Name</label>
                        <input type="text" class="form-control" id="serviceName" name="serviceName" required>
                    </div>
                    <div class="mb-3">
                        <label for="serviceDescription" class="form-label">Description</label>
                        <input type="text" class="form-control" id="serviceDescription" name="serviceDescription">
                    </div>
                    <div class="mb-3">
                        <label for="serviceType" class="form-label">Type</label>
                        <select class="form-select" id="serviceType" name="serviceType">
                            <option value="simple">Simple</option>
                            <option value="exec">Exec</option>
                            <option value="oneshot">Oneshot</option>
                            <option value="forking">Forking</option>
                            <option value="dbus">D-Bus</option>
                            <option value="notify">Notify</option>
                            <option value="notify-reload">Notify Reload</option>
                            <option value="idle">Idle</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="serviceUser" class="form-label">User</label>
                        <input type="text" class="form-control" id="serviceUser" name="serviceUser" value="{{ request.user or 'pi' }}">
                    </div>
                    <div class="mb-3">
                        <label for="execPath" class="form-label">Exec Path</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="execPath" name="execPath" required>
                            <button type="button" class="btn btn-outline-info" id="inspect-exec-path" title="Open this executable in the File Explorer editor" aria-label="Open executable in File Explorer editor" hidden>
                                <i class="fas fa-file-code"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="serviceParams" class="form-label">Parameters</label>
                        <input type="text" class="form-control" id="serviceParams" name="serviceParams">
                    </div>
                    <div class="mb-3">
                        <label for="restartPolicy" class="form-label">Restart Policy</label>
                        <select class="form-select" id="restartPolicy" name="restartPolicy">
                            <option value="always">Always</option>
                            <option value="on-success">On Success</option>
                            <option value="on-failure">On Failure</option>
                            <option value="on-abnormal">On Abnormal</option>
                            <option value="on-watchdog">On Watchdog</option>
                            <option value="on-abort">On Abort</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="restartSec" class="form-label">RestartSec (0-100s)</label>
                        <input type="number" class="form-control" id="restartSec" name="restartSec" min="0" max="100" value="1">
                    </div>
                    <div class="mb-3">
                        <label for="workingDirectory" class="form-label">Working Directory</label>
                        <input type="text" class="form-control" id="workingDirectory" name="workingDirectory">
                    </div>
            </form>
            <section class="service-preview-pane">
                <label for="servicePreview" class="form-label">Service File Preview</label>
                <textarea class="form-control" id="servicePreview" readonly spellcheck="false"></textarea>
                <button id="submit-service" class="btn btn-primary" style="width: 100%;">Create Service</button>
            </section>
        </div>
    </div>
</div>
